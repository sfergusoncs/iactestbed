trigger: none

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - uat
      - staging
      - prod
      - sandbox


  - name: deployVnet
    displayName: 'Deploy VNet'
    type: boolean
    default: true
  - name: deployRedis
    displayName: 'Deploy Redis'
    type: boolean
    default: true
  - name: deployAKS
    displayName: 'Deploy AKS'
    type: boolean
    default: true
  - name: deployBlobCache
    displayName: 'Deploy Blob Cache'
    type: boolean
    default: true
  - name: deployBlobPerm
    displayName: 'Deploy Blob Perm'
    type: boolean
    default: true

  - name: subscriptionId
    displayName: 'Target Subscription ID'
    type: string
    default: ''

  - name: hubSubscriptionId
    displayName: 'Hub Subscription ID'
    type: string
    default: 'c290fb32-8a22-4aeb-9147-d6d4e54071dd'

  - name: imageTag
    displayName: 'Frontend Image Tag (rollback: set to an older version to redeploy it)'
    type: string
    default: 'latest'

pool:
  name: default

variables:
  serviceConnection: 'sandman-sc-${{ parameters.environment }}'
  hubServiceConnection: 'sandman-sc-hub'
  location: 'southcentralus'
  resourceGroup: 'sandman-rg-${{ parameters.environment }}'
  vnetResourceGroup: 'sandman-rg-${{ parameters.environment }}vnet'
  parametersPath: 'infrastructure/parameters/${{ parameters.environment }}'
  vnetName: 'sandman-vnet-${{ parameters.environment }}'
  hubAcrLoginServer: 'sandmanacrhub-brgyhrbngfbdfhba.azurecr.io'
  hubAfdProfileName: 'Sandman-AFD'
  hubAfdEndpointName: 'sandman-afdep'
  # Object ID of the App Registration/SP backing hubServiceConnection itself (not a
  # managed identity on any Azure resource - there's no `az` query to derive this, it
  # has to be looked up once: `az ad sp show --id <hubServiceConnection's App ID from
  # its ADO service connection details> --query id -o tsv`). Needed because "Configure
  # Front Door Origin" calls `az afd origin create --private-link-resource ...` under
  # this same service connection, and Azure's linked-authorization check requires the
  # *calling* identity - not AFD's own managed identity - to have read access on the
  # linked PLS resource. Update this if hubServiceConnection is ever recreated.
  hubServiceConnectionObjectId: '1eb1a865-d6c5-4c54-9653-adce55472ee9'
  # helm/kubelogin live in C:\tools on the self-hosted agent. They were originally
  # installed via WinGet under user SFerguson_SA, but that only put them on the
  # *installing user's* PATH, in a profile folder NetworkService (the account the
  # agent runs as) can't even traverse into - neither a System PATH update nor an
  # agent service restart made them resolvable. Copied to this shared, ACL-neutral
  # location instead and referenced directly, sidestepping both the PATH and the
  # profile-permission issue at once.
  toolsPath: '/c/tools'
  MSYS_NO_PATHCONV: 1
  MSYS2_ARG_CONV_EXCL: '*'

stages:
  - stage: Deploy
    displayName: 'Deploy ${{ parameters.environment }} Environment'
    jobs:
      - job: DeployInfrastructure
        steps:

          # Create Resource Group
          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --name $(resourceGroup) \
                  --location $(location)

          # Create VNet Resource Group
          # Kept separate from the main RG so teardown (a blanket delete of the main
          # RG) never touches the VNet/subnets/route table/peerings - those are free
          # resources and painful to re-establish (cross-subscription peering,
          # private DNS zone links, RBAC) if deleted and recreated.
          - task: AzureCLI@2
            displayName: 'Create VNet Resource Group'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --name $(vnetResourceGroup) \
                  --location $(location)

              #Create Routetable
          - task: AzureCLI@2
            displayName: 'Deploy Route Table'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --template-file infrastructure/modules/routetable.bicep \
                  --parameters $(parametersPath)/routetable.params.json \
                  --parameters routeTableName=sandman-rt-${{ parameters.environment }} \
                  --parameters tags="{'app':'sandman','environment':'${{ parameters.environment }}'}"

          # Deploy VNet
          - task: AzureCLI@2
            displayName: 'Deploy VNet'
            condition: and(succeeded(), eq('${{ parameters.deployVnet }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --template-file infrastructure/modules/vnet.bicep \
                  --parameters $(parametersPath)/vnet.params.json \
                  --parameters environment=${{ parameters.environment }} \
                  --parameters location=$(location)

          # Peer Hub to Spoke
          - task: AzureCLI@2
            displayName: 'Peer Hub to Spoke'
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Remote VNet: /subscriptions/${{ parameters.subscriptionId }}/resourceGroups/$(vnetResourceGroup)/providers/Microsoft.Network/virtualNetworks/sandman-vnet-${{ parameters.environment }}"

                existing=$(az network vnet peering show \
                  --name sandman-peer-to-${{ parameters.environment }} \
                  --resource-group sandman-rg-hub \
                  --vnet-name sandman-vnet-hub \
                  --query 'name' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "Peering already exists, skipping"
                else
                  az network vnet peering create \
                    --name sandman-peer-to-${{ parameters.environment }} \
                    --resource-group sandman-rg-hub \
                    --vnet-name sandman-vnet-hub \
                    --remote-vnet "/subscriptions/${{ parameters.subscriptionId }}/resourceGroups/$(vnetResourceGroup)/providers/Microsoft.Network/virtualNetworks/sandman-vnet-${{ parameters.environment }}" \
                    --allow-vnet-access true \
                    --allow-forwarded-traffic true
                fi

          # Link spoke VNet to the hub ACR's private DNS zone
          # (ACR itself lives only in the hub subscription - see hub resources
          # in CLAUDE.md. This just gives the spoke's pods DNS resolution to it.)
          - task: AzureCLI@2
            displayName: 'Link ACR DNS Zone (hub)'
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                vnetId="/subscriptions/${{ parameters.subscriptionId }}/resourceGroups/$(vnetResourceGroup)/providers/Microsoft.Network/virtualNetworks/$(vnetName)"

                az deployment group create \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --template-file infrastructure/modules/acr.bicep \
                  --parameters $(parametersPath)/acr.params.json \
                  --parameters environment=${{ parameters.environment }} \
                  --parameters vnetId="$vnetId"

          # Deploy Blob Cache Storage
          - task: AzureCLI@2
            displayName: 'Deploy Blob Cache Storage'
            condition: and(succeeded(), eq('${{ parameters.deployBlobCache }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                existing=$(az storage account show \
                --subscription ${{ parameters.subscriptionId }} \
                --resource-group $(resourceGroup) \
                --name sandmanblobcache${{ parameters.environment }} \
                --query 'name' \
                --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "blob cache already exists, skipping deployment"
                else
                peSubnetId=$(az network vnet subnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --vnet-name $(vnetName) \
                  --name sandman-snet-pe \
                  --query 'id' \
                  --output tsv)

                vnetId=$(az network vnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --name $(vnetName) \
                  --query 'id' \
                  --output tsv)

                az deployment group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --template-file infrastructure/modules/blobcache.bicep \
                  --parameters $(parametersPath)/blobcache.params.json \
                  --parameters environment=${{ parameters.environment }} \
                  --parameters location=$(location) \
                  --parameters subnetId="$peSubnetId" \
                  --parameters vnetId="$vnetId"
                fi

          # Create RSV Resource Group (prod only)
          - task: AzureCLI@2
            displayName: 'Create RSV Resource Group'
            condition: eq('${{ parameters.environment }}', 'prod')
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --name sandman-rg-rsv-${{ parameters.environment }} \
                  --location $(location)

          # Deploy Blob Perm Storage
          - task: AzureCLI@2
            displayName: 'Deploy Blob Perm Storage'
            condition: and(succeeded(), eq('${{ parameters.deployBlobPerm }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                existing=$(az storage account show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandmanperm${{ parameters.environment }} \
                  --query 'name' \
                  --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "blob perm already exists, skipping deployment"
                else
                peSubnetId=$(az network vnet subnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --vnet-name $(vnetName) \
                  --name sandman-snet-pe \
                  --query 'id' \
                  --output tsv)

                vnetId=$(az network vnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --name $(vnetName) \
                  --query 'id' \
                  --output tsv)

                az deployment group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --template-file infrastructure/modules/blobperm.bicep \
                  --parameters $(parametersPath)/blobperm.params.json \
                  --parameters environment=${{ parameters.environment }} \
                  --parameters location=$(location) \
                  --parameters subnetId="$peSubnetId" \
                  --parameters vnetId="$vnetId"
                  fi

              # Deploy REDIS
          - task: AzureCLI@2
            displayName: 'Deploy redis'
            condition: and(succeeded(), eq('${{ parameters.deployRedis }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                existing=$(az redisenterprise show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-redis-${{ parameters.environment }} \
                  --query 'name' \
                  --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "redis already exists, skipping deployment"
                else
                peSubnetId=$(az network vnet subnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --vnet-name $(vnetName) \
                  --name sandman-snet-pe \
                  --query 'id' \
                  --output tsv)

                vnetId=$(az network vnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --name $(vnetName) \
                  --query 'id' \
                  --output tsv)

                az deployment group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --template-file infrastructure/modules/redis.bicep \
                  --parameters $(parametersPath)/redis.params.json \
                  --parameters environment=${{ parameters.environment }} \
                  --parameters location=$(location) \
                  --parameters subnetId="$peSubnetId" \
                  --parameters vnetId="$vnetId"
                fi
              # Deploy AKS
          - task: AzureCLI@2
            displayName: 'Deploy AKS'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                existing=$(az aks show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-aks-${{ parameters.environment }} \
                  --query 'name' \
                  --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "AKS cluster already exists, skipping deployment"
                else
                aksSubnetId=$(az network vnet subnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --vnet-name $(vnetName) \
                  --name sandman-snet-aks \
                  --query 'id' \
                  --output tsv)

                az deployment group create \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --template-file infrastructure/modules/aks.bicep \
                  --parameters $(parametersPath)/aks.params.json \
                  --parameters environment=${{ parameters.environment }} \
                  --parameters location=$(location) \
                  --parameters aksSubnetId="$aksSubnetId"
                fi

          # Link AKS Private DNS Zone to Hub
          # AKS's own "system" private DNS zone (auto-created in the node resource
          # group) is linked only to this spoke's VNet by default - the self-hosted
          # agent lives in the hub VNet and can't resolve the cluster's private FQDN
          # without a second link. Confirmed via Microsoft's own hub-and-spoke
          # guidance for private AKS clusters. Requires a one-time RBAC grant (see
          # CLAUDE.md Known Gotchas) - this spoke's service connection SP needs
          # Private DNS Zone Contributor scoped to sandman-vnet-hub in the hub
          # subscription, so the virtualNetworks/join/action check succeeds.
          - task: AzureCLI@2
            displayName: 'Link AKS Private DNS Zone to Hub'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                nodeResourceGroup=$(az aks show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-aks-${{ parameters.environment }} \
                  --query 'nodeResourceGroup' \
                  --output tsv)

                aksDnsZoneName=$(az network private-dns zone list \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group "$nodeResourceGroup" \
                  --query '[0].name' \
                  --output tsv)

                existing=$(az network private-dns link vnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group "$nodeResourceGroup" \
                  --zone-name "$aksDnsZoneName" \
                  --name sandman-dns-link-aks-hub-${{ parameters.environment }} \
                  --query 'name' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "DNS zone link to hub already exists, skipping"
                else
                  az network private-dns link vnet create \
                    --subscription ${{ parameters.subscriptionId }} \
                    --resource-group "$nodeResourceGroup" \
                    --zone-name "$aksDnsZoneName" \
                    --name sandman-dns-link-aks-hub-${{ parameters.environment }} \
                    --virtual-network "/subscriptions/${{ parameters.hubSubscriptionId }}/resourceGroups/sandman-rg-hub/providers/Microsoft.Network/virtualNetworks/sandman-vnet-hub" \
                    --registration-enabled false
                fi

              # Assign Network Contributor to AKS UAMI
          - task: AzureCLI@2
            displayName: 'Assign Network Contributor to AKS UAMI'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                uamiPrincipalId=$(az identity show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-uami-aks-${{ parameters.environment }} \
                  --query 'principalId' \
                  --output tsv)

                vnetId=$(az network vnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --name $(vnetName) \
                  --query 'id' \
                  --output tsv)

                existing=$(az role assignment list \
                  --assignee-object-id $uamiPrincipalId \
                  --role 'Network Contributor' \
                  --scope $vnetId \
                  --subscription ${{ parameters.subscriptionId }} \
                  --query '[0].id' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "Role assignment already exists, skipping"
                else
                  az role assignment create \
                    --assignee-object-id $uamiPrincipalId \
                    --assignee-principal-type ServicePrincipal \
                    --role 'Network Contributor' \
                    --scope $vnetId \
                    --subscription ${{ parameters.subscriptionId }}
                fi

          # Human-access convenience grant only - nothing else in this pipeline run
          # depends on it, so a failure here (e.g. the AD group doesn't exist in this
          # tenant/environment) shouldn't block the rest of the deployment. Reported
          # in the "Post-Deploy Configuration Summary" step below instead.
          - task: AzureCLI@2
            displayName: 'Assign AKS Admin Role to CSOL_Server_Admin'
            continueOnError: true
            condition: succeededOrFailed()
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GROUP_ID=$(az ad group show --group "CSOL_Server_Admin" --query id -o tsv)

                az role assignment create \
                  --role "Azure Kubernetes Service RBAC Cluster Admin" \
                  --assignee-object-id $GROUP_ID \
                  --assignee-principal-type Group \
                  --scope /subscriptions/${{ parameters.subscriptionId }}/resourceGroups/$(resourceGroup)/providers/Microsoft.ContainerService/managedClusters/sandman-aks-${{ parameters.environment }} \
                  || echo "Role assignment already exists, skipping"

          # Assign AKS RBAC Cluster Admin to service connection SP
          - task: AzureCLI@2
            displayName: 'Assign AKS RBAC Cluster Admin to Service Connection SP'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                SP_OBJECT_ID=$(az ad sp show \
                  --id $(az account show --query user.name -o tsv) \
                  --query id -o tsv)

                scope=/subscriptions/${{ parameters.subscriptionId }}/resourceGroups/$(resourceGroup)/providers/Microsoft.ContainerService/managedClusters/sandman-aks-${{ parameters.environment }}

                existing=$(az role assignment list \
                  --assignee-object-id $SP_OBJECT_ID \
                  --role "Azure Kubernetes Service RBAC Cluster Admin" \
                  --scope $scope \
                  --subscription ${{ parameters.subscriptionId }} \
                  --query '[0].id' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "Role assignment already exists, skipping"
                else
                  az role assignment create \
                    --role "Azure Kubernetes Service RBAC Cluster Admin" \
                    --assignee-object-id $SP_OBJECT_ID \
                    --assignee-principal-type ServicePrincipal \
                    --scope $scope \
                    --subscription ${{ parameters.subscriptionId }}
                fi

          # Get Kubelet Identity Client ID
          - task: AzureCLI@2
            displayName: 'Get Kubelet Identity Client ID'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                kubeletClientId=$(az aks show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-aks-${{ parameters.environment }} \
                  --query "identityProfile.kubeletidentity.clientId" \
                  --output tsv)

                kubeletPrincipalId=$(az aks show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-aks-${{ parameters.environment }} \
                  --query "identityProfile.kubeletidentity.objectId" \
                  --output tsv)

                echo "##vso[task.setvariable variable=kubeletClientId;isOutput=true]$kubeletClientId"
                echo "##vso[task.setvariable variable=kubeletPrincipalId;isOutput=true]$kubeletPrincipalId"
            name: getKubeletIdentity

          # Grant AcrPull to Kubelet Identity (cross-subscription - ACR lives in hub)
          - task: AzureCLI@2
            displayName: 'Grant AcrPull to Kubelet Identity'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                acrId=$(az acr list \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --query "[?loginServer=='$(hubAcrLoginServer)'].id" \
                  --output tsv)

                existing=$(az role assignment list \
                  --assignee-object-id $(getKubeletIdentity.kubeletPrincipalId) \
                  --role "AcrPull" \
                  --scope $acrId \
                  --query '[0].id' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "Role assignment already exists, skipping"
                else
                  az role assignment create \
                    --assignee-object-id $(getKubeletIdentity.kubeletPrincipalId) \
                    --assignee-principal-type ServicePrincipal \
                    --role "AcrPull" \
                    --scope $acrId
                fi

          # Grant App Config Data Reader to Kubelet Identity (cross-subscription)
          - task: AzureCLI@2
            displayName: 'Grant App Config Data Reader to Kubelet Identity'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                scope=/subscriptions/${{ parameters.hubSubscriptionId }}/resourceGroups/sandman-rg-hub/providers/Microsoft.AppConfiguration/configurationStores/sandman-Appconfig-hub

                existing=$(az role assignment list \
                  --assignee-object-id $(getKubeletIdentity.kubeletPrincipalId) \
                  --role "App Configuration Data Reader" \
                  --scope $scope \
                  --query '[0].id' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "Role assignment already exists, skipping"
                else
                  az role assignment create \
                    --assignee-object-id $(getKubeletIdentity.kubeletPrincipalId) \
                    --assignee-principal-type ServicePrincipal \
                    --role "App Configuration Data Reader" \
                    --scope $scope
                fi

          # Install App Configuration Provider
          - task: AzureCLI@2
            displayName: 'Install App Configuration Provider'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-aks-${{ parameters.environment }} \
                  --overwrite-existing

                export PATH="$PATH:$(toolsPath)"

                # This cluster has Azure AD RBAC enabled, so the kubeconfig above
                # defaults to interactive devicecode auth - convert it to use this
                # pipeline's own service principal instead, since nothing can
                # complete a browser login on an unattended agent.
                kubelogin convert-kubeconfig -l azurecli

                # Microsoft's docs previously pointed at a classic Helm chart repo
                # (azure.github.io/AppConfiguration-KubernetesProvider/helm), which
                # has since been retired (404) in favor of the OCI-based chart below.
                helm upgrade --install azureappconfiguration.kubernetesprovider \
                  oci://mcr.microsoft.com/azure-app-configuration/helmchart/kubernetes-provider \
                  --namespace azappconfig-system \
                  --create-namespace

          # Deploy AzureAppConfigurationProvider resource
          - task: AzureCLI@2
            displayName: 'Deploy App Config Provider Resource'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                kubectl create namespace sandman --dry-run=client -o yaml | kubectl apply -f -
                cat <<EOF | kubectl apply -f -
                apiVersion: azconfig.io/v1
                kind: AzureAppConfigurationProvider
                metadata:
                  name: sandman-appconfig
                  namespace: sandman
                spec:
                  endpoint: https://sandman-Appconfig-hub.azconfig.io
                  auth:
                    managedIdentityClientId: "$(getKubeletIdentity.kubeletClientId)"
                  configuration:
                    selectors:
                      - keyFilter: "sandman-frontend/runtime-config"
                        labelFilter: "${{ parameters.environment }}"
                    trimKeyPrefixes:
                      - "sandman-frontend/"
                  target:
                    configMapName: runtime-config-frontend
                EOF

          # Deploy Frontend Helm Chart
          - task: AzureCLI@2
            displayName: 'Deploy Frontend Helm Chart'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                export PATH="$PATH:$(toolsPath)"

                helm upgrade --install sandman-frontend \
                  ./infrastructure/charts/sandman-frontend \
                  -f ./infrastructure/charts/sandman-frontend/values.yaml \
                  -f ./infrastructure/charts/sandman-frontend/values-${{ parameters.environment }}.yaml \
                  --set image.tag=${{ parameters.imageTag }} \
                  --namespace sandman \
                  --create-namespace

          # Wait for Load Balancer IP
          - task: AzureCLI@2
            displayName: 'Wait for Load Balancer IP'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Waiting for Load Balancer IP..."
                for i in {1..20}; do
                  lbIp=$(kubectl get service sandman-frontend-${{ parameters.environment }}-svc \
                    --namespace sandman \
                    --output jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
                  if [ -n "$lbIp" ]; then
                    echo "Load Balancer IP: $lbIp"
                    echo "##vso[task.setvariable variable=lbIp;isOutput=true]$lbIp"
                    break
                  fi
                  echo "Attempt $i/20 — waiting 15s..."
                  sleep 15
                done
                if [ -z "$lbIp" ]; then
                  echo "##vso[task.logissue type=error]Timed out waiting for Load Balancer IP"
                  exit 1
                fi
            name: waitForLb

          # Create Private Link Service
          - task: AzureCLI@2
            displayName: 'Create Private Link Service'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                aksSubnetId=$(az network vnet subnet show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(vnetResourceGroup) \
                  --vnet-name $(vnetName) \
                  --name sandman-snet-aks \
                  --query 'id' \
                  --output tsv)

                lbFrontendId=$(az network lb frontend-ip list \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group MC_$(resourceGroup)_sandman-aks-${{ parameters.environment }}_$(location) \
                  --lb-name kubernetes-internal \
                  --query "[?privateIPAddress=='$(waitForLb.lbIp)'].id" \
                  --output tsv)

                existing=$(az network private-link-service show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-pls-frontend-${{ parameters.environment }} \
                  --query 'name' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "Private Link Service already exists, skipping"
                else
                  # --subnet is a full resource ID here (spans a different resource
                  # group than this PLS), so --vnet-name is omitted - it's only needed
                  # when --subnet is given as a plain name.
                  az network private-link-service create \
                    --subscription ${{ parameters.subscriptionId }} \
                    --resource-group $(resourceGroup) \
                    --name sandman-pls-frontend-${{ parameters.environment }} \
                    --subnet $aksSubnetId \
                    --lb-frontend-ip-configs $lbFrontendId \
                    --location $(location)
                fi

                plsId=$(az network private-link-service show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-pls-frontend-${{ parameters.environment }} \
                  --query 'id' \
                  --output tsv)

                plsAlias=$(az network private-link-service show \
                  --subscription ${{ parameters.subscriptionId }} \
                  --resource-group $(resourceGroup) \
                  --name sandman-pls-frontend-${{ parameters.environment }} \
                  --query 'properties.alias || alias' \
                  --output tsv)

                echo "##vso[task.setvariable variable=plsId;isOutput=true]$plsId"
                echo "##vso[task.setvariable variable=plsAlias;isOutput=true]$plsAlias"
            name: createPls

          # Grant PLS Read to Hub Service Connection
          # "Configure Front Door Origin" (next step) calls `az afd origin create
          # --enable-private-link true --private-link-resource ...` under
          # hubServiceConnection. Azure's linked-authorization check requires that
          # same calling identity (not AFD's own managed identity) to have read
          # access on the linked PLS resource - which lives in this spoke's own
          # subscription, where hubServiceConnection otherwise has no access at all.
          # Runs under this spoke's own service connection (already has ample rights
          # in its own resource group) to grant that read access. The PLS itself
          # lives in the ephemeral main RG (recreated every teardown/rebuild), so
          # this runs every deployment rather than being a one-time manual grant.
          - task: AzureCLI@2
            displayName: 'Grant PLS Read to Hub Service Connection'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                existing=$(az role assignment list \
                  --assignee-object-id $(hubServiceConnectionObjectId) \
                  --role 'Reader' \
                  --scope $(createPls.plsId) \
                  --subscription ${{ parameters.subscriptionId }} \
                  --query '[0].id' --output tsv 2>/dev/null)

                if [ -n "$existing" ]; then
                  echo "Hub service connection already has Reader on the PLS, skipping"
                else
                  az role assignment create \
                    --assignee-object-id $(hubServiceConnectionObjectId) \
                    --assignee-principal-type ServicePrincipal \
                    --role 'Reader' \
                    --scope $(createPls.plsId) \
                    --subscription ${{ parameters.subscriptionId }}
                fi

          # Configure Front Door Origin
          - task: AzureCLI@2
            displayName: 'Configure Front Door Origin'
            condition: and(succeeded(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Ensure the origin group exists before creating the origin
                existingOriginGroup=$(az afd origin-group show \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --origin-group-name sandman-${{ parameters.environment }} \
                  --query 'name' --output tsv 2>/dev/null)

                if [ -n "$existingOriginGroup" ]; then
                  echo "Origin group already exists, skipping"
                else
                  az afd origin-group create \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --profile-name $(hubAfdProfileName) \
                    --origin-group-name sandman-${{ parameters.environment }} \
                    --probe-request-type GET \
                    --probe-protocol Http \
                    --probe-interval-in-seconds 30 \
                    --probe-path "/" \
                    --sample-size 4 \
                    --successful-samples-required 3
                fi

                existingOrigin=$(az afd origin show \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --origin-group-name sandman-${{ parameters.environment }} \
                  --origin-name sandman-${{ parameters.environment }} \
                  --query 'name' --output tsv 2>/dev/null)

                if [ -n "$existingOrigin" ]; then
                  echo "Origin already exists, skipping"
                else
                  az afd origin create \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --profile-name $(hubAfdProfileName) \
                    --origin-group-name sandman-${{ parameters.environment }} \
                    --origin-name sandman-${{ parameters.environment }} \
                    --host-name $(createPls.plsAlias) \
                    --origin-host-header sandman-${{ parameters.environment }}.chalksolutions.com \
                    --http-port 30440 \
                    --https-port 443 \
                    --priority 1 \
                    --weight 1000 \
                    --enable-private-link true \
                    --private-link-resource $(createPls.plsId) \
                    --private-link-location $(location) \
                    --private-link-request-message "AFD origin for sandman-${{ parameters.environment }}"
                fi

                # Approve the private link connection
                # AFD's connection request can take a few minutes to actually appear
                # on the PLS after the origin is created - a flat 30s sleep-then-check
                # was often too short in practice, leaving the connection Pending and
                # requiring manual approval. Poll instead, matching the "Wait for
                # Load Balancer IP" pattern elsewhere in this pipeline. There is no
                # "list-connections" command - pending connections are a property of
                # the PLS resource itself, under privateEndpointConnections.
                connectionId=""
                for i in {1..20}; do
                  connectionId=$(az network private-link-service show \
                    --subscription ${{ parameters.subscriptionId }} \
                    --resource-group $(resourceGroup) \
                    --name sandman-pls-frontend-${{ parameters.environment }} \
                    --query "(properties.privateEndpointConnections || privateEndpointConnections)[?properties.privateLinkServiceConnectionState.status=='Pending'].name | [0]" \
                    --output tsv)
                  if [ -n "$connectionId" ]; then
                    echo "Pending private link connection found: $connectionId"
                    break
                  fi
                  echo "Attempt $i/20 - no pending connection yet, waiting 15s..."
                  sleep 15
                done

                if [ -n "$connectionId" ]; then
                  az network private-link-service connection update \
                    --subscription ${{ parameters.subscriptionId }} \
                    --resource-group $(resourceGroup) \
                    --service-name sandman-pls-frontend-${{ parameters.environment }} \
                    --name $connectionId \
                    --connection-status Approved
                  echo "Approved private link connection $connectionId"
                else
                  echo "##vso[task.logissue type=warning]No pending private link connection appeared within 5 minutes - approve manually: az network private-link-service connection update --resource-group $(resourceGroup) --service-name sandman-pls-frontend-${{ parameters.environment }} --name <connection-name> --connection-status Approved"
                fi

          # Create Front Door Route
          # Reuses the existing shared endpoint ($(hubAfdEndpointName)); attaches the
          # environment's custom domain if it's already been provisioned/validated
          # (that provisioning itself stays manual - it needs chalksolutions.com DNS
          # access this pipeline doesn't have), otherwise falls back to the default
          # AFD hostname so the route still works.
          # Nothing later in this run depends on the route succeeding, so a failure
          # here (e.g. the custom domain isn't validated yet) shouldn't block the
          # rest of the deployment. Reported in "Post-Deploy Configuration Summary".
          - task: AzureCLI@2
            displayName: 'Create Front Door Route'
            continueOnError: true
            condition: and(succeededOrFailed(), eq('${{ parameters.deployAKS }}', 'True'))
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # --custom-domains takes the custom domain's *name*, not its full
                # resource ID (confirmed via az afd route create --help's own
                # example: "--custom-domains cd001", a bare name, same convention
                # as --origin-group already using a plain name rather than an ID).
                customDomainName=$(az afd custom-domain list \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --query "[?hostName=='sandman-${{ parameters.environment }}.chalksolutions.com'].name | [0]" \
                  --output tsv)

                if [ -n "$customDomainName" ]; then
                  az afd route create \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --profile-name $(hubAfdProfileName) \
                    --endpoint-name $(hubAfdEndpointName) \
                    --route-name sandman-${{ parameters.environment }}-route \
                    --origin-group sandman-${{ parameters.environment }} \
                    --supported-protocols Http Https \
                    --forwarding-protocol HttpOnly \
                    --https-redirect Enabled \
                    --link-to-default-domain Disabled \
                    --custom-domains "$customDomainName" \
                    || echo "Route already exists, skipping"
                else
                  echo "##vso[task.logissue type=warning]No AFD custom domain found for sandman-${{ parameters.environment }}.chalksolutions.com - creating route on the default AFD hostname instead. Provision/validate the custom domain, then re-run to attach it."
                  az afd route create \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --profile-name $(hubAfdProfileName) \
                    --endpoint-name $(hubAfdEndpointName) \
                    --route-name sandman-${{ parameters.environment }}-route \
                    --origin-group sandman-${{ parameters.environment }} \
                    --supported-protocols Http Https \
                    --forwarding-protocol HttpOnly \
                    --https-redirect Enabled \
                    --link-to-default-domain Enabled \
                    || echo "Route already exists, skipping"
                fi

          # Reminders
          - task: Bash@3
            displayName: 'Post-Deploy Reminders'
            condition: always()
            inputs:
              targetType: 'inline'
              script: |
                echo "##vso[task.logissue type=warning]MANUAL: Peer OG prod VNet to sandman-vnet-${{ parameters.environment }} if not already done"
                echo "##vso[task.logissue type=warning]MANUAL: Link private DNS zones to OG prod VNet if not already done"
                echo "##vso[task.logissue type=warning]MANUAL: No automated image push to the hub ACR exists yet (images are pushed manually from a local machine). Once a push identity (e.g. a future GitHub Action) is decided, grant it AcrPush on sandman-rg-hub's ACR."

          # These 3 steps (CSOL_Server_Admin grant, both branches of Create Front Door
          # Route) run with continueOnError - a failure there doesn't stop the run, so
          # check their actual current state here rather than trusting each step's
          # own (possibly green-but-wrong) status.
          - task: AzureCLI@2
            displayName: 'Post-Deploy Configuration Summary'
            condition: always()
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Checking configuration items that continue-on-error rather than fail the pipeline..."

                GROUP_ID=$(az ad group show --group "CSOL_Server_Admin" --query id -o tsv 2>/dev/null)
                if [ -z "$GROUP_ID" ]; then
                  echo "##vso[task.logissue type=warning]MISSING: AD group 'CSOL_Server_Admin' not found - AKS admin access for that group was not granted."
                else
                  existing=$(az role assignment list \
                    --assignee-object-id $GROUP_ID \
                    --role "Azure Kubernetes Service RBAC Cluster Admin" \
                    --scope /subscriptions/${{ parameters.subscriptionId }}/resourceGroups/$(resourceGroup)/providers/Microsoft.ContainerService/managedClusters/sandman-aks-${{ parameters.environment }} \
                    --subscription ${{ parameters.subscriptionId }} \
                    --query '[0].id' --output tsv 2>/dev/null)
                  if [ -n "$existing" ]; then
                    echo "OK: CSOL_Server_Admin has AKS RBAC Cluster Admin on sandman-aks-${{ parameters.environment }}."
                  else
                    echo "##vso[task.logissue type=warning]MISSING: CSOL_Server_Admin does not have AKS RBAC Cluster Admin on sandman-aks-${{ parameters.environment }} - grant manually."
                  fi
                fi

                if az afd route show \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --profile-name $(hubAfdProfileName) \
                    --endpoint-name $(hubAfdEndpointName) \
                    --route-name sandman-${{ parameters.environment }}-route \
                    -o none 2>/dev/null; then
                  echo "OK: Front Door route 'sandman-${{ parameters.environment }}-route' exists."
                else
                  echo "##vso[task.logissue type=warning]MISSING: Front Door route 'sandman-${{ parameters.environment }}-route' was not created - the frontend has no path through Front Door. Investigate and re-run."
                fi
