trigger: none

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - uat
      - staging
      - prod
      - sandbox

  - name: subscriptionId
    displayName: 'Target Subscription ID'
    type: string
    default: ''

  - name: hubSubscriptionId
    displayName: 'Hub Subscription ID'
    type: string
    default: 'c290fb32-8a22-4aeb-9147-d6d4e54071dd'

  - name: confirm
    displayName: 'Type the environment name to confirm'
    type: string
    default: ''

pool:
  name: default

variables:
  serviceConnection: 'sandman-sc-${{ parameters.environment }}'
  hubServiceConnection: 'sandman-sc-hub'
  resourceGroup: 'sandman-rg-${{ parameters.environment }}'
  vnetResourceGroup: 'sandman-rg-${{ parameters.environment }}vnet'
  rsvRG: 'sandman-rg-rsv-${{ parameters.environment }}'
  hubAfdProfileName: 'Sandman-AFD'
  hubAfdEndpointName: 'sandman-afdep'

stages:

  # Validate confirmation before touching anything
  - stage: Validate
    displayName: 'Validate Confirmation'
    jobs:
      - job: ConfirmDestruction
        displayName: 'Check confirmation matches environment'
        steps:
          - bash: |
              if [ "${{ parameters.confirm }}" != "${{ parameters.environment }}" ]; then
                echo "##[error] Confirmation '${{ parameters.confirm }}' does not match environment '${{ parameters.environment }}'. Aborting."
                exit 1
              fi
              echo "Confirmation matched. Proceeding with teardown of ${{ parameters.environment }} in subscription ${{ parameters.subscriptionId }}."
            displayName: 'Validate Confirmation'

  # Teardown the compute/data layer only - $(vnetResourceGroup) is intentionally
  # never touched here. It holds the VNet, subnets, route table, hub<->spoke
  # peering, and the ACR private DNS zone link - all free resources that are
  # expensive/fragile to re-establish (cross-subscription peering handshake,
  # private DNS zone links, RBAC scoped to the VNet), so they're kept permanently
  # and only the billable resources below get recreated each cycle.
  - stage: Teardown
    displayName: 'Teardown ${{ parameters.environment }}'
    dependsOn: Validate
    jobs:
      - job: DeleteResourceGroups
        displayName: 'Delete compute/data resources'
        steps:
        # Delete Front Door Route (must go before the origin group it references)
          - task: AzureCLI@2
            displayName: 'Delete Front Door Route'
            continueOnError: true
            condition: succeededOrFailed()
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az afd route delete \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --endpoint-name $(hubAfdEndpointName) \
                  --route-name sandman-${{ parameters.environment }}-route \
                  --yes || echo "Route not found, skipping"

        # Delete Front Door Origin
          - task: AzureCLI@2
            displayName: 'Delete Front Door Origin'
            continueOnError: true
            condition: succeededOrFailed()
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az afd origin delete \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --origin-group-name sandman-${{ parameters.environment }} \
                  --origin-name sandman-${{ parameters.environment }} \
                  --yes || echo "Origin not found, skipping"

        # Delete Front Door Origin Group
          - task: AzureCLI@2
            displayName: 'Delete Front Door Origin Group'
            continueOnError: true
            condition: succeededOrFailed()
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az afd origin-group delete \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --origin-group-name sandman-${{ parameters.environment }} \
                  --yes || echo "Origin group not found, skipping"

        # Delete the main resource group - AKS, Redis, Blob Cache, Blob Perm, and
        # the Private Link Service all live here and go with it. Networking lives in
        # $(vnetResourceGroup) instead and is never targeted by this pipeline.
          - task: AzureCLI@2
            displayName: 'Delete Main Resource Group'
            continueOnError: true
            condition: succeededOrFailed()
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group delete \
                  --name $(resourceGroup) \
                  --subscription ${{ parameters.subscriptionId }} \
                  --yes || echo "##vso[task.logissue type=warning]Failed to delete resource group $(resourceGroup) - needs manual removal."

                echo "Teardown complete (deletion is async - Azure removes resources in the background). $(vnetResourceGroup) and $(rsvRG) were not touched by design."

          - task: AzureCLI@2
            displayName: 'Reminders'
            condition: always()
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "##[warning] MANUAL: the AFD custom domain for sandman-${{ parameters.environment }}.chalksolutions.com (if provisioned) is not deleted by this pipeline and may need manual cleanup/re-validation before reuse."

          # Final sweep: check actual Azure state (not just each step's exit code) and
          # report anything still left behind, since every step above is best-effort
          # and continues past failures rather than stopping the run.
          - task: AzureCLI@2
            displayName: 'Verify Teardown - Hub Side'
            condition: always()
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Checking hub-side resources for sandman-${{ parameters.environment }}..."

                if az afd route show \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --profile-name $(hubAfdProfileName) \
                    --endpoint-name $(hubAfdEndpointName) \
                    --route-name sandman-${{ parameters.environment }}-route \
                    -o none 2>/dev/null; then
                  echo "##vso[task.logissue type=warning]LEFTOVER: Front Door route 'sandman-${{ parameters.environment }}-route' still exists on endpoint '$(hubAfdEndpointName)' - delete manually."
                else
                  echo "OK: Front Door route not found (removed, or hubAfdEndpointName doesn't match the real endpoint - double check if unsure)."
                fi

                if az afd origin-group show \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --profile-name $(hubAfdProfileName) \
                    --origin-group-name sandman-${{ parameters.environment }} \
                    -o none 2>/dev/null; then
                  echo "##vso[task.logissue type=warning]LEFTOVER: Front Door origin group 'sandman-${{ parameters.environment }}' (and its origin) still exists - delete manually."
                else
                  echo "OK: Front Door origin group not found."
                fi

                if az network private-dns link vnet show \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --zone-name privatelink.azurecr.io \
                    --name sandman-dns-link-acr-${{ parameters.environment }} \
                    -o none 2>/dev/null; then
                  echo "OK: ACR private DNS zone link still present (expected - preserved by design, not part of teardown)."
                else
                  echo "##vso[task.logissue type=warning]UNEXPECTED: ACR private DNS zone link 'sandman-dns-link-acr-${{ parameters.environment }}' is missing - this should have been preserved, not removed. Investigate."
                fi

                if az network vnet peering show \
                    --subscription ${{ parameters.hubSubscriptionId }} \
                    --resource-group sandman-rg-hub \
                    --vnet-name sandman-vnet-hub \
                    --name sandman-peer-to-${{ parameters.environment }} \
                    -o none 2>/dev/null; then
                  echo "OK: hub-to-spoke peering still present (expected - preserved by design, not part of teardown)."
                else
                  echo "##vso[task.logissue type=warning]UNEXPECTED: hub-to-spoke peering 'sandman-peer-to-${{ parameters.environment }}' is missing - this should have been preserved, not removed. Investigate."
                fi

          - task: AzureCLI@2
            displayName: 'Verify Teardown - Spoke Side'
            condition: always()
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Checking spoke-side resources for ${{ parameters.environment }}..."

                if az group show --subscription ${{ parameters.subscriptionId }} --name $(resourceGroup) -o none 2>/dev/null; then
                  echo "##[warning]Main resource group $(resourceGroup) still present (deletion is async, so this is expected right after teardown - re-check in a few minutes; only a real problem if it's still here after that)."
                else
                  echo "OK: main resource group $(resourceGroup) is gone."
                fi

                if az group show --subscription ${{ parameters.subscriptionId }} --name $(vnetResourceGroup) -o none 2>/dev/null; then
                  echo "OK: VNet resource group $(vnetResourceGroup) still present (expected - preserved by design, not part of teardown)."
                else
                  echo "##vso[task.logissue type=warning]UNEXPECTED: VNet resource group $(vnetResourceGroup) is missing - this should have been preserved, not removed. Investigate."
                fi
