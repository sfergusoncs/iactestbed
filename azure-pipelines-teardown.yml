trigger: none

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - uat
      - staging
      - prod
      - sandbox

  - name: subscriptionId
    displayName: 'Target Subscription ID'
    type: string
    default: ''

  - name: hubSubscriptionId
    displayName: 'Hub Subscription ID'
    type: string
    default: 'c290fb32-8a22-4aeb-9147-d6d4e54071dd'

  - name: confirm
    displayName: 'Type the environment name to confirm'
    type: string
    default: ''

pool:
  name: default

variables:
  serviceConnection: 'sandman-sc-${{ parameters.environment }}'
  hubServiceConnection: 'sandman-sc-hub'
  location: 'southcentralus'
  resourceGroup: 'sandman-rg-${{ parameters.environment }}'
  rsvRG: 'sandman-rg-rsv-${{ parameters.environment }}'
  hubAfdProfileName: 'Sandman-AFD'
  hubAfdEndpointName: 'sandman-afdep'

stages:

  # Validate confirmation before touching anything
  - stage: Validate
    displayName: 'Validate Confirmation'
    jobs:
      - job: ConfirmDestruction
        displayName: 'Check confirmation matches environment'
        steps:
          - bash: |
              if [ "${{ parameters.confirm }}" != "${{ parameters.environment }}" ]; then
                echo "##[error] Confirmation '${{ parameters.confirm }}' does not match environment '${{ parameters.environment }}'. Aborting."
                exit 1
              fi
              echo "Confirmation matched. Proceeding with teardown of ${{ parameters.environment }} in subscription ${{ parameters.subscriptionId }}."
            displayName: 'Validate Confirmation'

        

  # Teardown all resource groups except RSV
  - stage: Teardown
    displayName: 'Teardown ${{ parameters.environment }}'
    dependsOn: Validate
    jobs:
      - job: DeleteResourceGroups
        displayName: 'Delete resource groups'
        steps:
        # Delete Front Door Route (must go before the origin group it references)
          - task: AzureCLI@2
            displayName: 'Delete Front Door Route'
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az afd route delete \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --endpoint-name $(hubAfdEndpointName) \
                  --route-name sandman-${{ parameters.environment }}-route \
                  --yes || echo "Route not found, skipping"

        # Delete Front Door Origin
          - task: AzureCLI@2
            displayName: 'Delete Front Door Origin'
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az afd origin delete \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --origin-group-name sandman-${{ parameters.environment }} \
                  --origin-name sandman-${{ parameters.environment }} \
                  --yes || echo "Origin not found, skipping"

        # Delete Front Door Origin Group
          - task: AzureCLI@2
            displayName: 'Delete Front Door Origin Group'
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az afd origin-group delete \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --profile-name $(hubAfdProfileName) \
                  --origin-group-name sandman-${{ parameters.environment }} \
                  --yes || echo "Origin group not found, skipping"

        # Delete ACR private DNS zone link (spoke VNet is about to be deleted, so
        # this link would otherwise be left dangling in the hub)
          - task: AzureCLI@2
            displayName: 'Delete ACR DNS Zone Link'
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az network private-dns link vnet delete \
                  --subscription ${{ parameters.hubSubscriptionId }} \
                  --resource-group sandman-rg-hub \
                  --zone-name privatelink.azurecr.io \
                  --name sandman-dns-link-acr-${{ parameters.environment }} \
                  --yes || echo "DNS zone link not found, skipping"

        # Delete Hub to Spoke Peering
          - task: AzureCLI@2
            displayName: 'Delete Hub to Spoke Peering'
            inputs:
              azureSubscription: $(hubServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az network vnet peering delete \
                  --name sandman-peer-to-${{ parameters.environment }} \
                  --resource-group sandman-rg-hub \
                  --vnet-name sandman-vnet-hub || echo "Peering not found, skipping"

        #remove peerings
          - task: AzureCLI@2
            displayName: 'Remove VNet Peerings'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get all peerings in the VNet and delete them
                az network vnet peering list \
                  --resource-group $(resourceGroup) \
                  --vnet-name sandman-vnet-${{ parameters.environment }} \
                  --subscription ${{ parameters.subscriptionId }} \
                  --query "[].name" -o tsv | \
                  xargs -I {} az network vnet peering delete \
                    --name {} \
                    --resource-group $(resourceGroup) \
                    --vnet-name sandman-vnet-${{ parameters.environment }} \
                    --subscription ${{ parameters.subscriptionId }}

          - task: AzureCLI@2
            displayName: 'List resource groups to be deleted'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                EXCLUDE="$(rsvRG)"

                echo "The following resource groups will be deleted:"
                az group list \
                  --subscription ${{ parameters.subscriptionId }} \
                  --query "[].name" -o tsv | \
                  grep -v "$EXCLUDE"

                echo "The following resource groups will be preserved:"
                echo "$EXCLUDE"

          - task: AzureCLI@2
            displayName: 'Delete resource groups'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                EXCLUDE="$(rsvRG)"

                az group list \
                  --subscription ${{ parameters.subscriptionId }} \
                  --query "[].name" -o tsv | \
                  grep -v "$EXCLUDE" | \
                  xargs -I {} az group delete \
                    --name {} \
                    --subscription ${{ parameters.subscriptionId }} \
                    --yes

                echo "Teardown complete. $EXCLUDE preserved."

          - task: AzureCLI@2
            displayName: 'Purge Key Vault'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az keyvault purge \
                  --name sandman-kv-${{ parameters.environment }} \
                  --location $(location) \
                  --subscription ${{ parameters.subscriptionId }}

          - task: AzureCLI@2
            displayName: 'Remind to remove OG Prod peering manually'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "##[warning] MANUAL ACTION REQUIRED:"
                echo "##[warning] Remove the VNet peering from OG Prod VNet to sandman-vnet-${{ parameters.environment }}"
                echo "##[warning] Resource Group: rg-cmstx-prod-southcentralus-001"
                echo "##[warning] VNet: <og-prod-vnet-name>"
                echo "##[warning] Peering name: sandman-peer-to-${{ parameters.environment }}"
                echo "##[warning] MANUAL: the AFD custom domain for sandman-${{ parameters.environment }}.chalksolutions.com (if provisioned) is not deleted by this pipeline and may need manual cleanup/re-validation before reuse."